name: presales-demo

services:
  presales-demo:
    build:
      context: ..
      dockerfile: 私域电商微信企微双端Demo/Dockerfile
    image: wechat-wecom-presales-demo:latest
    container_name: presales-demo
    ports:
      - "${HOST_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      FOUNDATION_MODEL_API_KEY: ${FOUNDATION_MODEL_API_KEY:?请在 .env 中设置 FOUNDATION_MODEL_API_KEY}
      PRESALES_SESSION_SECRET: ${PRESALES_SESSION_SECRET:?请在 .env 中设置 PRESALES_SESSION_SECRET（生产必填）}
    volumes:
      - presales-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/customer').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  presales-data:
