# 第 5 步 · 保健品私域电商全链路AI机会场景地图（业务级）
# 承接④业务级服务蓝图的5环节，挖掘覆盖全链路的AI机会。
# 机会粒度铁律：每个机会点 = 一个可独立立项、独立交付、独立完成业务闭环的增量价值单元，不是功能点或约束。
#   - 正品应答/版本对比/促销算账等是"7×24 RAG自动接待"机会内部的功能模块，不单独列为机会
#   - 合规话术库红线守护是O2的critical级合规护栏约束module（上线即具备），不单独列为机会
#   - 真人话术拟合与持续调优是O2的持续调优module（上线后迭代），不单独列为机会
#   - 自动打标属采购现成SCRM能力，不列为AI机会
#   - 兜底转人工是系统机制，是RAG自动接待的组成部分，不单独列为机会
# 后启：⑥业务级优先级矩阵 → ⑦业务级里程碑 → ⑧项目级产品画布（售前客服）
title: "保健品私域电商全链路AI机会场景地图（业务级·5环节4个独立价值机会）"
stages:
  # ══════════════════════════════════════════════════════════════
  # L1-1: 引流获客
  # ══════════════════════════════════════════════════════════════
  - name: "引流获客"
    steps:
      - activity: "直播引流钩子优化与加粉承接"
        role: "主播/运营"
        touchpoint: "抖音直播/巨量千川/企微活码"
        repetitive_tasks:
          - "引流钩子靠经验设计，缺乏数据驱动的系统化迭代"
          - "加粉后欢迎语与来源打标依赖人工逐个操作"
        cognitive_tasks:
          - "判断不同钩子对不同人群的转化效果并择优"
          - "根据直播场次匹配个性化开场口径与促销预告"
        # 本环节暂无独立AI机会：引流钩子A/B测试+转化归因属API+看板+数据分析（运营工具），非AI机会

  # ══════════════════════════════════════════════════════════════
  # L1-2: 售前客服1v1咨询 ← 本次AI规划聚焦环节（1个独立机会O1）
  # ══════════════════════════════════════════════════════════════
  - name: "售前客服1v1咨询"
    steps:
      - activity: "全天候售前咨询自动接待（正品答疑/版本对比/促销算账/需求澄清）"
        role: "RAG自动回复chatbot"
        touchpoint: "企微kf通道/RAG平台/四大知识库"
        repetitive_tasks:
          - "同质化询价、正品求证、版本对比、促销算账等标准化问题反复人工回答（占75%~85%）"
          - "夜间35%~45%咨询积压无人接待，首响>8小时，加粉30分钟黄金窗口大量错过"
        cognitive_tasks:
          - "正品凭据与版本差异说明话术未标准化，靠资深客服个人记忆，新人30天才能上岗"
          - "复杂促销规则叠加下人工算准到手价易错价，引发客诉赔付"
          - "澄清客户模糊需求靠资深客服经验，会话轮次拉长至15~30轮"
        ai_opportunities:
          - type: "innovation"
            name: "7×24 RAG自动接待"
            description: "「售前客户」在「1v1咨询全流程」下提供[RAG秒级检索应答+确定性规则算账+问题链引导澄清+未命中兜底转人工+合规红线守护+真人话术持续调优]能力，以「首响≤10秒、接待成本降50%、零夜班编制覆盖全时段流量、新人培训周期从30天压缩至7天、守住10%转化水位不下降、红线事件0起、真人拟合度≥90%」"
            modules:
              # 上线即具备（M2-M3 近期）
              - "正品溯源与版本应答（检索正品溯源库标准化应答）"
              - "商品库版本对比应答（检索商品库生成结构化对比）"
              - "促销规则库确定性算账（检索规则库计算到手价，大模型仅润色）"
              - "需求澄清问题链引导（检索结构化问题链逐步收敛）"
              - "未命中兜底转人工（低置信度自动转接附上下文摘要）"
              - "合规话术库红线守护【critical】（功效类长尾仅检索预审核合规语料，库内无答案即转人工不做推测，规避100万~200万元罚款与封号风险）"
              # 持续调优（M4-M6 中期，上线后迭代）
              - "真人话术拟合与语料调优（基于会话存档金牌客服语料调优应答风格，拟合度≥90%客户无机器感）"
              - "真实会话回流扩库（FDE真实会话回流，未命中扩库，自动接待率随交付周期持续爬升）"
            risk_control:
              - "价格与优惠结果绝对禁止大模型独立计算，必须由促销规则库返回确定性结果"
              - "发货时效承诺绝对禁止大模型推测，必须以订单系统返回值为准"
              - "功效表述绝对禁止大模型自由生成，仅检索预审核合规语料"

  # ══════════════════════════════════════════════════════════════
  # L1-3: 下单支付
  # ══════════════════════════════════════════════════════════════
  - name: "下单支付"
    steps:
      - activity: "支付引导与订单核对承接"
        role: "售前客服/订单系统"
        touchpoint: "企微/收款码/订单系统"
        repetitive_tasks:
          - "支付方式说明依赖人工话术，无标准化引导流程"
          - "付款截图确认与地址/SKU核对靠人工复述，高峰期漏接"
        cognitive_tasks:
          - "多渠道支付（扫码/红包/支付宝）对账复杂易出错"
        ai_opportunities:
          - type: "repetitive"
            name: "智能支付承接与订单自动核对"
            description: "「售前客户」在「下单支付」下提供[标准化支付引导+付款截图自动识别+订单要素自动核对确认]能力，以「支付完成率提升、付款漏接率归零、订单核对错误率降为0、消除付款后无人确认的信任危机」"

  # ══════════════════════════════════════════════════════════════
  # L1-4: 物流发货履约
  # ══════════════════════════════════════════════════════════════
  - name: "物流发货履约"
    steps:
      - activity: "发货时效承诺与物流轨迹查询"
        role: "售前/售后客服"
        touchpoint: "企微/订单系统/物流系统"
        repetitive_tasks:
          - "物流状态需跨系统人工查询后手动复述，重复劳动"
          - "夜间物流咨询无人应答"
        cognitive_tasks:
          - "发货时效凭感觉承诺，说错引发客诉"
        ai_opportunities:
          - type: "repetitive"
            name: "物流查询自动化与时效确定性承诺"
            description: "「售前/售后客户」在「物流查询」下提供[订单物流数据源实时查询+确定性时效承诺话术]能力，以「7×24即时应答替代人工跨系统查单复述、时效客诉消除、释放售前客服精力聚焦新客转化」"

  # ══════════════════════════════════════════════════════════════
  # L1-5: 复购与私域运营
  # ══════════════════════════════════════════════════════════════
  - name: "复购与私域运营"
    steps:
      - activity: "复购引导与沉睡客户唤回"
        role: "私域运营/客服"
        touchpoint: "企微/CRM/会员系统"
        repetitive_tasks:
          - "复购跟进靠人工经验无预测，大量老客在服务周期结束后自然流失"
          - "沉睡客户无系统化唤回，48h未成交与超周期未复购直接流失"
        cognitive_tasks:
          - "预测客户复购周期与最佳触达时机"
          - "按客户分群设计个性化唤回策略与优惠力度"
        ai_opportunities:
          - type: "cognitive"
            name: "AI复购周期预测与精准唤回"
            description: "「私域运营」在「复购运营」下提供[复购周期预测模型+沉睡客户分群+个性化唤回策略]能力，以「复购率从35%提升至45%、月均复购频次1.8→2.5次、LTV主体增量（复购贡献占比60%+）、沉睡客户激活率提升」"
