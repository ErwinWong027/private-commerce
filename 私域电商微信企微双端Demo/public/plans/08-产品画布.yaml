# 第 8 步 · 售前客服AI助手产品画布（项目级）
# 本画布是项目级交付物，从业务级⑥优先级矩阵与⑦里程碑中选取售前客服环节展开。
# 业务级④-⑦覆盖保健品私域电商全链路5环节4个独立AI机会（O1-O4）；
# 本画布聚焦售前客服环节的O1（7×24 RAG自动接待）核心机会展开，
# 包含O1的上线modules（正品答疑/版本对比/促销算账/需求澄清/转人工/合规护栏critical），
# 是能完成售前转化业务闭环的最小演示产品。O1持续调优module（真人拟合+回流扩库）留到后续优化阶段。
title: 售前转化闭环 Demo · 企微 AI 售前助手
description: 项目级产品画布——从业务级⑥⑦中选取售前客服环节O1展开。面向保健品私域售前的最小演示闭环。客户进入企微后，AI 先完成秒级接待，再围绕「是不是正品 / 现在活动价怎么算 / 需不需要转人工」三类高频决策问题完成自动回复；一旦碰到敏感功效、低置信度或客户点名人工，即无摩擦转接，并用转化守护看板观察小流量试点是否稳定。O1的合规护栏module（critical级）与上线同批，持续调优module（真人拟合）留到后续。
userRoles:
  - 进入企微私域咨询的潜在下单客户（直播、短视频、投流加粉后进入 1v1）
  - 售前客服（从全程手工回复转为兜底接管与异常处理）
  - 运营/店长（负责活动口径、试点范围与转化守护）
userPains:
  - 客户刚进线时等回复太久，第一轮信任没有建立起来就流失
  - 客户最常卡在「是不是正品」「为什么这个版本更贵」「渠道靠不靠谱」这些成交前问题
  - 活动价、满减、赠品规则靠客服临时心算，容易错价、说错口径
  - 涉及功效、安全、适用人群时容易越界，踩广告合规红线
  - AI 回答不确定时如果不能顺滑转人工，客户会觉得被机器人敷衍
aiInput:
  - 客户在企微发出的高频售前问题（如「这是正品吗」「现在买多少钱」「有什么活动」「转人工」）
  - 客户提及的 SKU、版本、规格、活动场次或直播来源
  - 客户点名人工、敏感功效词、连续追问等风险信号
dataKnowledge:
  - 正品溯源与商品库：资质文号、授权链路、防伪方式、SKU/版本/规格差异
  - 促销规则库：满减、赠品、组合价、限购、有效期、不同场次口径
  - 预审核合规话术库：功效、安全、适用人群等敏感问题只能走白名单语料（O1合规护栏critical module的基石）
  - 转人工规则与试点看板口径：什么情况必须转人工、如何判断转化不下降
workflow:
  - 秒级首响：客户进入企微后先收到欢迎语与第一轮承接回复，避免冷场流失
  - 意图分流：识别是正品信任问题、价格促销问题，还是需要转人工/敏感问题
  - 正品信任应答：检索正品溯源与商品库，给出凭据、版本差异与验真指引
  - 确定性算账：命中促销问题时调用规则库输出到手价与活动说明，大模型只做话术组织
  - 合规与转人工：一旦涉及敏感功效、低置信度或客户点名人工，立即输出保守话术并附摘要转人工（O1合规护栏critical module）
  - 试点守护：记录首响、转人工、错价、转化等指标，按小流量试点判断是否继续放量
modelUsage:
  - 核心编排：通用大模型负责首响话术、意图识别、知识检索后的自然语言组织与转人工摘要
  - 硬约束：正品凭据只能来自知识库，价格只能来自规则库，敏感功效只能来自合规白名单，三类内容都不允许自由编造
aiOutput:
  - 企微对话中的欢迎语、正品凭据说明、版本差异说明、活动到手价与活动解释
  - 命中不足时的保守答复、转人工提示，以及供人工接手的上下文摘要
tools:
  - 企微微信客服（kf 账号）API 消息回调、代发与人工接管
  - RAG 平台与正品溯源/商品/合规话术知识库
  - 促销规则计算模块（可先用结构化规则表或 Mock 数据实现）
  - 基础埋点与试点看板（首响、转人工、错价、转化）
productType:
  - 企微侧可直接演示的 AI 售前助手 Demo：先接待、再答疑、再算价，必要时转人工
  - 演示目标是跑通最小售前转化闭环，不追求一次性覆盖全部售前与售后场景
  - 风险边界：优先走 kf 官方通道；价格按规则表输出；敏感功效不自由生成；库内无答案即转人工
userGains:
  - 接得住：客户进入企微就能秒级收到回复，不错过第一轮成交窗口
  - 答得准：正品信任问题统一口径，减少因为解释含糊带来的流失
  - 算得清：活动价和到手价能快速说清楚，减少错价客诉与犹豫
  - 转得顺：AI 不确定时不会硬答，而是把上下文整理好交给人工
  - 守得住：通过小流量试点先验证转化不下降，再决定是否放量
notInScope:
  - 夜间全自动接待全量上线与来源自动打标（采购SCRM能力）本次不作为演示闭环核心
  - 需求澄清问题链、适配版本推荐、合规凑单建议（O1高级module）本次不做
  - 物流查询与发货时效承诺（O3）属于履约侧，本次不纳入
  - O1持续调优module（真人话术拟合+真实会话回流调优）留到后续优化阶段，本次不做
  - 支付承接（O2）、复购预测（O4）属其他环节，本次不纳入
  - 多渠道全量上线、复杂后台运营台与长期数据治理本次不做
