# ============ 四、聚焦售前客服：三个结构性约束 ============
# 作为③各环节扫描的结论，而非分析前提
presales_focus:
  positioning: "经各环节痛点扫描，售前客服环节critical×4最集中，是AI赋能第一切入点。以下三个结构性约束是从扫描中析出的核心瓶颈——AI的价值方向由此推导，而非预设前提。"
  constraints:
    - name: "响应受班次限制"
      evidence: "夜间35%~45%咨询等待>8小时；白班首响1~3分钟（高峰5~10分钟起）；人均同时接待上限8~15人"
      cost_impact: "年人力成本43万~240万元（6-20人×6000~10000元/人/月）"
      ai_direction: "7×24秒级自动应答（体验维度）"
      detail_metrics:
        - {metric: "首次响应时长（白班）", value: "1~3 分钟（高峰 5~10 分钟起）", basis: "[推断] 私域 1v1 通行水平"}
        - {metric: "首次响应时长（夜间）", value: ">8 小时（次日集中回复）", basis: "[推断] 6-20 人团队不设夜班"}
        - {metric: "夜间及非工作时段咨询占比", value: "预计 35%~45%", basis: "[推断] 抖音晚间流量高峰口径"}
        - {metric: "人均同时接待上限", value: "8~15 人（超过即漏回错回）", basis: "[推断] 私域强运营业态通行值"}
        - {metric: "单次售前会话轮次/时长", value: "15~30 轮 / 20~60 分钟", basis: "[推断] 需会话存档验证"}
        - {metric: "新客服培训上岗周期", value: "约 30 天（合规话术培训占比最大）", basis: "[推断] 强监管品类"}
    - name: "人力成本随流量线性上涨"
      evidence: "放量→咨询涨→只能加人；补夜班需三班倒至少加2~3编制；年流失率30%~50%×30天重训"
      cost_impact: "直接人力成本43万~240万元/年；隐性成本：流失重训+合规质检无专职编制"
      ai_direction: "RAG承接75%~85%标准化问题，人力解耦（效率维度）"
      detail_costs:
        - {item: "直接人力成本", value: "综合用工成本 6000~10000 元/人/月；6-20 人年成本约 43 万~240 万元", basis: "[推断] 招聘平台公开薪酬"}
        - {item: "线性上涨机制", value: "放量→咨询涨→只能加人；补夜班需三班倒至少加 2~3 编制", basis: "[事实] 客户明确的核心约束"}
        - {item: "隐性成本", value: "年流失率 30%~50% × 30 天重训；合规质检无专职编制", basis: "[推断]"}
    - name: "回答质量与合规不稳定"
      evidence: "合规靠培训+个人自觉；夜间/大促疲劳时段违规话术高发；会话存档若未开通则无合规自证"
      cost_impact: "虚假广告最高罚100万~200万元；1v1私聊话术同属商业广告；私域资产面临罚款与封号风险"
      ai_direction: "预审核合规话术库+确定性规则检索（质量维度）"
      detail_compliance:
        regulatory:
          - "保健食品注册+备案双轨制，须有『蓝帽子』文号；普通食品不得宣称减肥功能（市场监管总局）"
          - "《广告法》：不得涉及疾病预防治疗功能、禁绝对化用语；虚假广告最高罚 100 万~200 万元，1v1 私聊话术同样构成商业广告"
          - "2025-2026 监管趋势：私域直播虚假/夸大宣传被列为消费问题高发区"
        current_state:
          - "合规靠『培训+个人自觉』兜底；夜间与大促疲劳时段违规话术高发 [推断]"
          - "会话存档若未开通，则既无合规自证也无 AI 训练语料——优先核实项"

# ============ 五、企微生态与 SaaS 成熟度（为什么走 FDE 自建） ============
ecosystem_maturity:
  wecom_access_paths:
    - {name: "P1 微信客服（kf 账号）API", verdict: "官方唯一支持全自动 1v1 对话的通道，可挂抖音落地页入口"}
    - {name: "P2 聊天工具栏 JSAPI（侧边栏）", verdict: "只能做 Copilot 辅助，无法全自动——与本项目形态不符"}
    - {name: "P3 会话存档 API", verdict: "不能发消息，但是合规自证 + 真人话术语料的基础设施"}
    - {name: "P4 智能机器人", verdict: "群内 @ 触发，1v1 私聊不适用"}
  key_constraint: "员工号 1v1 私聊官方 API 不提供实时回调与代发消息；非官方 RPA/协议模拟存在限流封号风险——实施通道选型（kf 通道 vs 员工号自动化）须与客户确认风险接受度"
  capability_maturity:
    - {capability: "RAG 知识库问答（通用域）", maturity: "成熟", gap: "通用 RAG 不解决减肥保健品合规语料——语料建设与预审核才是工作量"}
    - {capability: "渠道打标/欢迎语/活码分流", maturity: "成熟", gap: "直接采购或用企微原生，勿重复造轮子"}
    - {capability: "敏感词拦截（关键词级）", maturity: "成熟", gap: "挡不住功效宣称语义变体；语义级合规拦截市场无成熟供给"}
    - {capability: "1v1 全自动对话（通用大模型）", maturity: "部分成熟", gap: "瓶颈不在对话能力，而在领域知识+合规确定性——FDE 建库要解决的"}
    - {capability: "促销算账/价格计算（大模型直接算）", maturity: "不成熟", gap: "LLM 算术不可靠是公认边界；须走确定性规则检索路线"}
    - {capability: "真人话术拟合", maturity: "部分成熟", gap: "无开箱即用产品，依赖客户会话存档语料"}
    - {capability: "多轮需求澄清（问题链引导）", maturity: "部分成熟", gap: "正品溯源/版本对比/用法适配问题链属行业知识工程"}
    - {capability: "幻觉抑制（不乱答）", maturity: "部分成熟", gap: "RAG+预审核+未命中拒答转人工是最可靠路线；这是不设真人在环的成立前提"}
  saas_landscape:
    - {segment: "通用 SCRM（微伴/尘锋/探马）", ai_form: "侧边栏话术辅助+离线质检；不做 1v1 自动回复", fit: "工具给到，效果靠客户自建"}
    - {segment: "电商商城型（有赞/微盟）", ai_form: "侧边栏订单/商品查询+营销自动化；对话 AI 弱", fit: "电商域全、品类知识为零"}
    - {segment: "对话式 AI（句子互动）", ai_form: "大模型对话机器人可全自动应答", fit: "通用对话无品类合规语料"}
    - {segment: "大厂客服系（企点/云商）", ai_form: "全渠道机器人+旅程编排，偏呼叫中心", fit: "配置复杂、无品类定制，与小团队错配"}
  why_fde: "市场供给全部是『工具』形态（SaaS 订阅），效果依赖客户自建；而客户团队 6-20 人、无技术编制，不具备把工具变成『能自动接待的客服』的能力。『FDE 定制交付 × RAG 全自动』是市场空白象限，也是该业态唯一现实的落地方式。"

# ============ 六、接入方案与厂商对比 ============
delivery_solution:
  delivery_model: "FDE（前沿部署工程师）直接进入客户业务，在企微侧部署定制化 RAG 智能客服，交付『能直接上岗自动接待』的业务结果，而非卖标准化 SaaS 工具"
  rag_knowledge_base:
    - "商品库：SKU、版本/规格、价格、正品溯源凭据（资质文号/授权链路/防伪验证）——标品信任逻辑下『是不是正品/什么版本』是首位高频问题"
    - "合规话术库：功效表述全部预审核，RAG 检索到的即合规语料——合规内置于建库而非外挂拦截"
    - "促销规则库：满减/赠品/组合价规则入库，算账由检索规则确定性应答"
    - "需求澄清问题链：版本/规格/用法适配澄清话术"
    - "物流/发货：发货时效、快递查询话术，对接订单数据源"
  quadrant: "四象限（AI 接管程度 × 交付模式）中『FDE × RAG 全自动』为空白象限——本方案定位；护城河 = 交付模式 + 减肥保健品类 RAG 资产（合规话术库/促销规则库/问题链）随交付客户数累积复用"
  automation_stance: "约 10% 转化率为守护基线；人工仅作 RAG 未命中/客户点名兜底转接，不设真人在环审核"

# ============ 七、SWOT 分析 ============
swot:
  strengths:
    - {point: "标品品类问题高度标准化", evidence: "正品版本/价格/物流三类占 75%~85%，功效认知已在直播间完成", impact: "高"}
    - {point: "FDE 交付模式补齐『最后一公里』", evidence: "客户 6-20 人无技术编制，无法把 SaaS 工具变成自动客服", impact: "高"}
    - {point: "品类化 RAG 资产可复用", evidence: "合规话术库/促销规则库/问题链随交付客户数累积", impact: "中"}
    - {point: "会话存档语料可拟合真人成交话术", evidence: "P3 会话存档 API 提供合规语料基础", impact: "中"}
  weaknesses:
    - {point: "员工号 1v1 自动化通道有合规风险", evidence: "官方 API 不支持员工号代发消息，须走 kf 通道或承担 RPA 封号风险", impact: "高"}
    - {point: "效果高度依赖客户内部数据可得性", evidence: "会话存档是否开通、订单/物流 API、SKU 资质均需确认", impact: "高"}
    - {point: "FDE 交付重、规模化前期成本高", evidence: "贴身建库调优人力密集，早期难标准化", impact: "中"}
  opportunities:
    - {point: "私域 AI 成为 2026 标配", evidence: "78% 企业将『AI 提升私域效率』列为关键需求", impact: "高"}
    - {point: "市场充斥『伪 AI』留出差异化空间", evidence: "智能标签准确率不足 70%、自动运营仍需人工兜底普遍存在", impact: "高"}
    - {point: "大健康私域高复购放大 LTV 价值", evidence: "润天 35%~50%、LemonBox 40% 复购率", impact: "中"}
  threats:
    - {point: "监管趋严，私域虚假宣传是高发区", evidence: "虚假广告最高罚 100 万~200 万元；私聊话术同属商业广告", impact: "高"}
    - {point: "企微对营销骚扰风控趋严", evidence: "自动化触达频率过高有封号损失私域资产风险", impact: "中"}
    - {point: "白牌资质敞口放大合规风险", evidence: "无蓝帽子 SKU 宣称减肥功效，AI 放大产能同时放大风险", impact: "高"}
  cross_strategies:
    - {type: "SO（优势×机会）", strategy: "以标品标准化 + FDE 交付切入伪 AI 空白市场，用『交付即上岗』对打只卖工具的 SaaS，快速建立品类化 RAG 资产壁垒"}
    - {type: "WO（劣势×机会）", strategy: "优先走 kf 官方通道规避员工号封号风险，把『合规自动接待』本身作为差异化卖点，借私域 AI 标配化窗口做标杆客户"}
    - {type: "ST（优势×威胁）", strategy: "合规内置于知识库（预审核语料）应对监管趋严；用会话存档做合规自证，把强监管从威胁转为准入门槛"}
    - {type: "WT（劣势×威胁）", strategy: "上线前强制 SKU 资质审计，无蓝帽子 SKU 不做功效表述；触达频率保守设计，用兜底转人工守住合规与账号安全底线"}

# ============ 八、结论 ============
conclusions:
  business_level_conclusion: "瘦身减肥类保健品私域电商整体业务的价值链中，售前客服环节（L1-2）痛点最集中（critical×4），三个结构性约束（响应受班次限制 / 人力随流量线性上涨 / 合规靠人工兜底）均在此环节，是AI赋能的第一切入点。复购运营为第二切入点（远期）。"
  ai_value_directions:
    - {constraint: "响应受班次限制", evidence: "夜间 35%~45% 咨询等待 >8 小时", direction: "7×24 秒级自动应答（体验）"}
    - {constraint: "人力成本随流量线性上涨", evidence: "咨询涨只能加人，年人力成本 43 万~240 万", direction: "RAG 承接 75%~85% 标准化问题，人力解耦（效率）"}
    - {constraint: "回答质量与合规不稳定", evidence: "30 天培训、话术参差、夜间/大促高发", direction: "预审核合规话术库+确定性规则检索（质量）"}
  non_goal: "本报告分析对象为保健品私域电商整体业务（引流→售前→下单→履约→复购），售前客服是其中一个关键子流程（L1-2）。售前客服的首单转化率约10%为行业正常健康水位（守护基线：维持≥10%不下降），不作为整个私域电商的北极星指标——北极星为业务级LTV。AI赋能的第一切入点是售前客服（痛点最集中），但非唯一分析对象。不设真人在环审核。"
  data_to_confirm:
    - "企微好友池总量、月新增加粉量、开口率、按时段咨询量分布"
    - "约 10% 转化率的统计口径（是否含沉默粉/统计周期）"
    - "会话存档是否已开通（合规自证 + RAG 语料前提）"
    - "售前问题结构真实占比（正品版本/价格/物流 vs 功效安全长尾）"
    - "产品资质：蓝帽子文号覆盖哪些 SKU，是否存在功效宣称合规敞口"
    - "促销规则/订单/物流数据的系统化程度与可对接 API"
    - "各环节转化漏斗数据（引流→加粉→咨询→下单→复购）"
  next_step: "下一步：②北极星 OSM 分析——以保健品私域电商业务级LTV为北极星（稳健增长≥15%），三层拆解：获客引流效率 / 售前转化降本（首单转化率≥10%作为支撑指标）/ 复购运营增量。售前客服是AI赋能的第一切入点，后续④服务蓝图与⑤AI场景地图以售前客服子流程为对象展开。"
