value_chain_overview:
  description: "瘦身减肥类保健品私域电商的端到端价值链：抖音直播引流 → 企微售前客服1v1 → 下单支付 → 物流发货履约 → 复购与私域运营。各环节在LTV中的角色不同，痛点分布不均。"
