      order: 2
      role: "企微1v1售前咨询：正品答疑→需求澄清→促销算账→下单撮合"
      ltv_role: "LTV首单贡献环节——约10%转化率，决定私域流量变现效率"
      key_metrics:
        - {metric: "首单转化率", current: "约10%（行业健康水位）", target: "守住≥10%"}
        - {metric: "首次响应时长（夜间）", current: ">8小时", target: "≤10秒"}
      pain_summary: "夜间无人接待、人力成本随流量线性上涨、合规靠人工兜底——三个结构性约束"
      ai_relevance: "高——痛点最集中（critical×4），AI赋能第一切入点，本规划聚焦环节"
    - name: "下单支付"
      order: 3
      role: "微信扫码/红包支付 → 订单信息核对 → 付款承接"
      ltv_role: "成交最后一公里——支付体验直接影响转化完成率"
      key_metrics:
        - {metric: "支付完成率", current: "[推断] 需核实", target: "提升"}
      pain_summary: "支付方式引导不当导致最后一步流失，付款截图确认依赖人工易超时"
      ai_relevance: "中——支付引导标准化、自动付款承接可优化"
    - name: "物流发货履约"
      order: 4
      role: "48h内发出 → 冷链物流 → 轨迹查询 → 到货跟进"
      ltv_role: "履约质量影响客户体验与复购意愿，服务边界止于发货跟进"
      key_metrics:
        - {metric: "发货时效", current: "48h内发出", target: "维持"}
      pain_summary: "时效凭感觉承诺易说错，冷链断链风险，物流查询挤占售前精力"
      ai_relevance: "中——物流查询自动化、时效确定性承诺"
    - name: "复购与私域运营"
      order: 5
      role: "效果跟进 → 复购周期预测 → 沉睡唤回 → 会员运营"
      ltv_role: "LTV主体增量环节——复购贡献占比60%+，决定长期盈利能力"
      key_metrics:
        - {metric: "老客复购率", current: "35%", target: "45%"}
        - {metric: "月均复购频次", current: "1.8次", target: "2.5次"}
      pain_summary: "复购靠人工经验无预测，沉睡客户无系统化唤回，老客自然流失"
      ai_relevance: "高——复购周期预测、精准唤回是LTV增量的第二AI切入点"

