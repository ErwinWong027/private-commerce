  reply: "您提到的情况属于禁忌/慎用人群（如甲状腺病史、正在用胰岛素/磺脲类、备孕孕产期等），这种情况不建议自行使用，需遵医嘱，我不能直接推进购买，帮您转人工进一步说明。"

