# 合规话术白名单（risk 只能走此处，超白名单转人工）
compliance_whitelist:
  - intent: 效果承诺
    trigger_words: ["瘦多少", "瘦几斤", "多久见效", "保证", "有没有用", "效果"]
    response_mode: safe_reply
    reply: "每个人的情况不一样，没办法承诺具体能瘦多少或多久见效，效果因人而异，具体以产品说明和个人使用情况为准哦。"
  - intent: 疾病治疗
    trigger_words: ["治疗", "治病", "降血糖", "血糖", "代替药", "替代药", "治好"]
    response_mode: transfer
    reply: "这类和疾病、用药相关的问题我不能直接给结论，建议遵医嘱，帮您转人工进一步说明。"
  - intent: 副作用与禁忌
    trigger_words: ["副作用", "恶心", "嗜睡", "口渴", "便秘", "呕吐"]
    response_mode: safe_reply
    reply: "常见反应包括饱腹感、恶心、嗜睡、口渴、便秘、呕吐，部分人会发热；如有明显不适请停用并咨询医生，具体情况可帮您转人工。"

# 禁忌/慎用人群固定口径（命中且坚持购买 → 不推进成交，转人工）
contraindications:
