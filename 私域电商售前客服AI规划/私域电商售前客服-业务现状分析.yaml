  next_step: "下一步：②北极星 OSM 分析——把三约束收敛为可度量的战略指标体系（NSM = 高意向客户首单转化率，稳健维持 ≥10% 的转化率护城河；三层拆解：底线维持/效率降本/增量捞回）"
