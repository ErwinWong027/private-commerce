# 第 7 步 · 保健品私域电商全链路AI里程碑计划（业务级）
# 覆盖5环节4个独立AI机会（O1-O4），9个月三阶段交付。
# 本计划是保健品私域电商整体业务的AI里程碑（非售前客服项目级制作计划）。
# 售前客服AI助手的项目级交付计划（O1）在⑧产品画布中展开。
# 排期铁律：被依赖者前置。O1 RAG自动接待是全链路转化引擎，须最先具备；
#           O1的合规护栏module与上线同批（红线守门）；O1的持续调优module依赖上线后语料，后置；
#           O4复购预测依赖CRM数据打通，属远期LTV增量。
#
# 结构变更（v7）：原O3合规话术库红线守护=O1的critical级合规护栏module（is_core降级，与O1同批）；
#                原O4真人话术拟合=O1的持续调优module（is_core降级，上线后迭代）。
# 结构变更（v8）：移除原O1引流钩子A/B测试（非AI机会）；原O2→O1, 原O3→O2, 原O4→O3, 原O5→O4。机会数量5→4。
#
# opportunity_id 铁律：里程碑主线是4个独立机会（O1-O4）。
#   - 核心机会任务：opportunity_id = 自身O编号（is_core: true），任务条显示醒目O徽章
#   - 支撑任务：opportunity_id = 其服务的O编号（is_core: false），是机会内部的组成部分，
#     不是独立里程碑环节，任务条显示"→O1"从属标签，视觉弱化
#   - 运营守护任务：opportunity_id = "运营"，跨机会配套
# 对应关系：与⑥优先级矩阵的O1-O4全覆盖且排期顺序一致（近期=第一梯队 / 中期=第二梯队 / 远期=远期）

