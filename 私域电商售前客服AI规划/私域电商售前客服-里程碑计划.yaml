title: "保健品私域电商售前客服 AI 里程碑计划（FDE 交付 · 依赖驱动排期）"
subtitle: "第 7 步 · 依据⑥优先级矩阵的机会依赖关系排期：被依赖的机会前置（兜底机制/首响/正品库/合规库为地基根节点），6 个月三阶段交付"

# 排期铁律：被依赖者前置。依赖根节点（RAG平台 / kf通道 / C15兜底机制 / 四大知识库）必须最先具备；
# 扩面机会（夜间接待/版本对比/需求澄清/物流查询）承接地基；提质机会（适配推荐/真人拟合/回流调优）依赖上线后语料，最后置。
quarters:
  - "M1"
  - "M2"
  - "M3"
  - "M4"
  - "M5"
  - "M6"
milestones:
  - name: "近期"
    endQuarter: "M2"
    title: "阶段一 · 自动接待地基（依赖根节点先行）"
    goals:
      - headline: "接得住"
        description: "kf 通道 + RAG 平台 + 兜底转人工机制跑通，7×24 秒级首响上线"
      - headline: "答得准正品"
        description: "正品溯源库 + 合规话术库 + 促销规则库建成，正品应答与确定性算账上线"
      - headline: "守得住转化"
        description: "转化率守护看板与打标同步就位，守约 10% 水位"
  - name: "中期"
    endQuarter: "M4"
    title: "阶段二 · 全流程标准化问答扩面"
    goals:
      - headline: "覆盖全时段"
        description: "夜间全自动接待与商品版本对比上线，覆盖 75%~85% 标准化问题"
      - headline: "打通数据源"
        description: "会话存档、订单/物流 API 对接，物流查询自动化"
  - name: "远期"
    endQuarter: "M6"
    title: "阶段三 · 拟合真人与持续提质"
    goals:
      - headline: "拟合真人"
        description: "真人话术拟合与适配推荐上线，消除机器感"
      - headline: "持续爬升"
        description: "真实会话回流调优，自动接待率与拟合度随交付周期上升"
teams:
  - id: "platform"
    name: "平台与通道"
    icon: "Server"
    tasks:
      - name: "kf 通道接入与消息回调"
        description: "企微微信客服通道打通，实时回调即检索即应答（依赖根节点）"
        startQuarter: "M1"
        endQuarter: "M1"
        milestoneTag: "近期"
        type: "研发"
      - name: "RAG 平台与基础知识库"
        description: "检索增强生成平台与语料管线搭建（依赖根节点）"
        startQuarter: "M1"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "研发"
      - name: "C15 未命中兜底转人工机制"
        description: "低置信度自动转接+上下文摘要，不设真人在环的成立前提（几乎被全部机会依赖，最先具备）"
        startQuarter: "M1"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "灰度上线"
  - id: "knowledge"
    name: "知识库工程"
    icon: "Database"
    tasks:
      - name: "C4/C8 正品溯源库+商品库建库"
        description: "资质文号/授权链路/防伪/版本规格结构化入库（标品信任逻辑首位依赖）"
        startQuarter: "M1"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "研发"
      - name: "C6 预审核合规话术库"
        description: "功效表述法务预审核入库，合规内置于建库（红线守门，与核心问答同批）"
        startQuarter: "M1"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "研发"
      - name: "C10 促销规则库建库"
        description: "满减/赠品/组合价规则结构化，支撑确定性算账"
        startQuarter: "M2"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "研发"
      - name: "C5 需求澄清问题链知识工程"
        description: "版本/规格/用法适配问题链结构化，产品化老客服澄清经验"
        startQuarter: "M3"
        endQuarter: "M3"
        milestoneTag: "中期"
        type: "研发"
  - id: "dialog"
    name: "对话应答上线"
    icon: "Smartphone"
    tasks:
      - name: "C1 7×24 秒级自动首响"
        description: "全时段首响≤10 秒，承接夜间加粉黄金窗口"
        startQuarter: "M2"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "正式上线"
      - name: "C4 正品溯源与版本应答"
        description: "标品信任逻辑首位高频问题标准化应答（与首响同批）"
        startQuarter: "M2"
        endQuarter: "M2"
        milestoneTag: "近期"
        type: "正式上线"
      - name: "C10 促销规则库确定性算账"
        description: "检索规则确定性算价，大模型仅润色，杜绝错价"
        startQuarter: "M2"
        endQuarter: "M3"
        milestoneTag: "近期"
        type: "灰度上线"
      - name: "C2 夜间咨询全自动接待"
        description: "承接夜间 35%~45% 咨询高峰，零夜班编制"
        startQuarter: "M3"
        endQuarter: "M3"
        milestoneTag: "中期"
        type: "灰度上线"
      - name: "C8 商品库检索版本对比"
        description: "秒级生成结构化版本对比结论，口径一致"
        startQuarter: "M3"
        endQuarter: "M4"
        milestoneTag: "中期"
        type: "灰度上线"
      - name: "C5/C9 需求澄清与适配推荐"
        description: "问题链引导澄清 + 检索匹配适配版本推荐"
        startQuarter: "M4"
        endQuarter: "M5"
        milestoneTag: "远期"
        type: "实测"
      - name: "C11 合规凑单建议"
        description: "基于满减门槛给凑单组合与到手价，不做压迫式推销"
        startQuarter: "M5"
        endQuarter: "M5"
        milestoneTag: "远期"
        type: "灰度上线"
  - id: "integration"
    name: "数据集成"
    icon: "Globe"
    tasks:
      - name: "C3 渠道活码/SCRM 打标接入"
        description: "自动来源打标与个性化开场（采购现成能力，不自建）"
        startQuarter: "M1"
        endQuarter: "M1"
        milestoneTag: "近期"
        type: "正式上线"
      - name: "会话存档 API 开通与合规取数"
        description: "打开合规自证与真人话术语料源（C7/C16 前置依赖）"
        startQuarter: "M2"
        endQuarter: "M3"
        milestoneTag: "中期"
        type: "研发"
      - name: "订单/物流数据源 API 对接"
        description: "打通物流查询与发货时效确定性数据（C12/C13 前置依赖）"
        startQuarter: "M3"
        endQuarter: "M4"
        milestoneTag: "中期"
        type: "研发"
      - name: "C12 物流状态自动查询"
        description: "对接数据源实时查询轨迹，7×24 即时应答"
        startQuarter: "M4"
        endQuarter: "M4"
        milestoneTag: "中期"
        type: "灰度上线"
      - name: "C13 发货时效确定性承诺"
        description: "基于订单系统时效数据生成承诺话术，与履约一致"
        startQuarter: "M5"
        endQuarter: "M5"
        milestoneTag: "远期"
        type: "灰度上线"
  - id: "guard"
    name: "守护与运营"
    icon: "Shield"
    tasks:
      - name: "C14 转化率守护监测看板"
        description: "AI 接管组 vs 人工对照组按周监测，放量闸门（与核心上线同批）"
        startQuarter: "M2"
        endQuarter: "M3"
        milestoneTag: "近期"
        type: "灰度上线"
      - name: "灰度放量闸门评审"
        description: "每档放量前须通过转化率闸门，连续两周为负即回滚"
        startQuarter: "M3"
        endQuarter: "M6"
        milestoneTag: "远期"
        type: "实测"
      - name: "C7 真人话术拟合"
        description: "基于会话存档金牌客服语料调优应答风格，拟合度≥90%"
        startQuarter: "M4"
        endQuarter: "M5"
        milestoneTag: "远期"
        type: "实测"
      - name: "C16 真实会话回流调优"
        description: "未命中与低拟合回答持续扩库调优，自动接待率持续爬升"
        startQuarter: "M4"
        endQuarter: "M6"
        milestoneTag: "远期"
        type: "研发"
