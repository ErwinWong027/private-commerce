# ============ 五、竞争格局与结论 ============
landscape_conclusion:
  quadrant:
    x_axis: "AI 接管程度（人机协作辅助 ←→ RAG 全自动应答）"
    y_axis: "交付模式（SaaS 工具订阅 ←→ FDE 定制交付）"
    positions:
      - "SaaS × 协作：微伴、尘锋、探马、有赞/微盟（存量最大；工具给到，效果靠客户自己）"
      - "SaaS/项目 × 自动：句子互动、企点/云商（通用对话自动化，无品类纵深）"
      - "FDE × 协作：传统定制开发外包（无 AI 纵深）"
      - "FDE × RAG 全自动：【空白象限】——本方案定位：品类化知识库 + 全流程自动应答 + 交付即上岗"
  competitive_verdict:
    - "SaaS 厂商的共同短板：只交付工具，减肥保健品团队没有能力也没有人力把工具变成『能自动卖货的客服』——FDE 补的正是这段最后一公里"
    - "通用对话 AI 的短板：无品类合规语料与促销规则库，客户自建成本高且有合规风险"
    - "本方案护城河：FDE 交付模式 + 减肥保健品类 RAG 资产（合规话术库/促销规则库/问题链）的组合，随交付客户数累积复用"
  client_challenge_qa:
    - q: "为什么不直接买微伴/句子互动这类现成产品？"
      a: "它们交付的是工具，知识库和运营仍要客户自己做；FDE 交付的是部署完成、直接自动接待的 RAG 客服，含品类合规话术库——客户团队零技术投入"
    - q: "100~1000 元中客单价，全自动回复能撑住转化吗？"
      a: "中客单价售前问题高度标准化（正品版本/价格促销/物流发货三类为主——标品信任逻辑，客户不问有没有效，只问是不是正品、什么版本），RAG 知识库可充分覆盖；约 10% 转化率为行业正常水位，自动化的价值在 7×24 响应与人力释放，而非追求转化率上限"
    - q: "合规怎么保证？"
      a: "合规内置于知识库：RAG 只检索预审核的合规语料生成回复，功效表述在建库阶段完成审核，而非事后拦截"
    - q: "部署要多久？"
      a: "FDE 模式下：知识库构建 + RAG 管道部署 2~4 周可上线首版，随后基于真实会话持续调优"
    - q: "全自动会不会把 10% 转化率做低？"
      a: "转化率是本项目最重要的守护指标：AI 接管期间按周对照监测，连续两周显著低于基线即触发回滚与知识库复盘；RAG 话术基于会话存档中真实客服对话语料拟合，保证与真人回答高度一致"
