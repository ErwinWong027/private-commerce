# ============ 一、交付模式：FDE（前沿部署工程师） ============
delivery_model:
  definition: "不做标准化 SaaS 产品卖工具订阅，而是 FDE（Forward Deployed Engineer）直接进入客户业务，在客户的企业微信侧部署定制化 RAG 智能客服，交付『能直接上岗自动接待』的业务结果。"
  vs_saas:
    - "SaaS 模式：交付通用工具，知识库建设、流程配置、运营调优全部由客户自己完成——落地效果高度依赖客户自身能力"
    - "FDE 模式：工程师贴身完成知识库构建（商品与正品溯源/合规话术/促销规则/物流）、RAG 管道部署、效果调优的全部工作，按业务结果交付"
  why_fits: "减肥保健品私域团队规模小（客服 6-20 人、常无专职技术），不具备自建或深度配置 SaaS 的能力；FDE 定制部署是该业态唯一现实的 AI 落地方式"

# ============ 二、核心技术方案：企微端基于 RAG 的 1v1 自动回复 ============
core_solution:
  summary: "客户消息进入企微 → RAG 检索定制知识库 → 直接生成并自动发送回复，覆盖售前全流程（询价/需求澄清/商品对比/促销算账/发货查询）。人工仅作为 RAG 未命中或客户主动要求时的兜底转接，不设强制真人在环环节。"
  rag_knowledge_base:
    - "商品库：SKU、版本/规格、价格、正品溯源凭据（资质文号/授权链路/防伪验证方式）——标品信任逻辑下『是不是正品/什么版本』是首位高频问题"
    - "合规话术库：功效表述全部预审核（规避《广告法》功效宣称红线），RAG 检索到的即是合规语料——合规内置于知识库而非外挂拦截"
    - "促销规则库：满减/赠品/组合价规则直接入库，算账问题由 RAG 检索规则直接应答"
    - "需求澄清问题链：版本/规格/用法适配澄清话术"
    - "物流/发货：发货时效、快递查询话术，对接订单数据源"
  automation_stance:
    conversion_baseline: "约 10% 售前转化率为正常水位——转化率作为守护指标进入 OSM（维持 ≥10% 不下降），不需要对未转化的 90% 做犹豫归因/挽回分析，也不为此保留人工环节"
    human_role: "兜底转接（RAG 未命中/客户点名人工），非在环审核"
    price_band: "100~1000 元均为中客单价，问题高度标准化（正品版本/价格促销/物流发货三类占绝大多数，功效认知已在直播间种草完成），RAG 知识库可充分覆盖"
  channel_facts:
    note: "企微官方接口能力边界（事实说明，供实施通道确认）"
    facts:
      - "微信客服（kf 账号）API：官方支持消息实时回调 + API 自动发送，客户无需加好友，可挂抖音落地页入口"
      - "员工号 1v1 私聊：官方 API 不提供实时消息回调与代发消息接口；实现员工号自动回复需借助非官方客户端自动化方式，实施前需与客户确认账号风险接受度"
      - "智能机器人：群内 @ 自动应答（频控 30 条/分钟），1v1 私聊不适用"
    source: "企微开发者中心 document/path/94638、101463"

# ============ 三、售前旅程 × RAG 自动回复映射 ============
journey_mapping:
  note: "『加好友询价 → 物流发货』全流程由 RAG 自动应答"
  stages:
    - stage: "① 抖音引流承接"
      how: "RAG 自动应答完成初筛答疑 + 引导添加/留存；7×24 全天候，无人工班次依赖"
    - stage: "② 加好友首触达"
      how: "渠道欢迎语自动发送 + 来源渠道自动打标（客户联系 API 规则能力）"
    - stage: "③ 询价 / 需求澄清 / 商品对比"
      how: "RAG 直接自动回复：检索正品溯源凭据、需求澄清问题链、商品版本参数与合规话术生成应答，无侧边栏、无人工确认环节"
    - stage: "④ 促销算账 / 凑单"
      how: "RAG 直接应答：促销规则已入知识库，检索规则生成算账结果与凑单建议"
    - stage: "⑤ 下单-发货跟进"
      how: "RAG 对接订单/物流数据源，自动查询并回复发货时效与物流状态"
  fallback: "全流程唯一人工触点：RAG 未命中或客户主动要求时转人工兜底"

