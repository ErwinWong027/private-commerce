# ============ 二、AI 能力项成熟度评估（专家质疑的正面回答） ============
capability_maturity:
  note: "评估口径：『成熟』= 有多家规模化商用供给、效果经市场验证；『部分成熟』= 通用能力可用但行业化/场景化需定制；『不成熟』= 无可靠商用供给或技术路线本身不可靠。"
  items:
    - capability: "RAG 知识库问答（通用域）"
      maturity: "mature"
      evidence: "企微智能机器人、阿里云百炼企微助手、各 SCRM AI 问答均为规模化商用；FAQ 型问答准确率已达商用水平"
      gap_for_us: "通用 RAG 不解决减肥保健品合规语料问题——语料建设与预审核才是工作量所在"
    - capability: "渠道打标 / 自动欢迎语 / 活码分流"
      maturity: "mature"
      evidence: "SCRM 标配十年成熟能力；微伴宣称 AI 标签准确率 95%（厂商口径）"
      gap_for_us: "直接采购或用企微原生，不构成差异化，勿重复造轮子"
    - capability: "敏感词拦截（关键词级）"
      maturity: "mature"
      evidence: "SCRM 会话质检/敏感词拦截为标配，多为事后质检"
      gap_for_us: "关键词级挡不住功效宣称的语义变体（『吃了包瘦』『三天见效』）；语义级合规拦截市场无成熟供给"
    - capability: "1v1 全自动对话（通用大模型驱动）"
      maturity: "partial"
      evidence: "句子互动等宣称『AI 员工直接上岗』，通用对话流畅度已可用；但行业共识是『自动运营仍需人工兜底』，无品类纵深"
      gap_for_us: "全自动的瓶颈不在对话能力，而在领域知识 + 合规确定性——恰是 FDE 建库要解决的"
    - capability: "促销算账 / 价格计算（大模型直接算）"
      maturity: "immature"
      evidence: "大模型算术与规则推理不可靠是公认技术边界；无厂商敢让 LLM 独立报价"
      gap_for_us: "本方案路线：促销规则结构化入 RAG 知识库，检索规则生成确定性结果，大模型仅话术润色——价格决策不由大模型完成"
    - capability: "真人话术拟合（个性化语气克隆）"
      maturity: "partial"
      evidence: "基于历史会话微调/少样本模仿技术可行，但无开箱即用产品；依赖客户会话存档语料"
      gap_for_us: "『和真人回答的拟合程度』是本项目验收维度之一，必须基于客户真实客服对话语料定制"
    - capability: "多轮需求澄清（问题链引导）"
      maturity: "partial"
      evidence: "通用多轮对话成熟；但『正品溯源/版本对比/用法适配』澄清问题链属行业知识工程，无现成供给"
      gap_for_us: "FDE 建库范围：需求澄清问题链为五大知识库之一"
    - capability: "幻觉抑制（不出错、不乱回答）"
      maturity: "partial"
      evidence: "RAG + 预审核语料 + 未命中拒答转人工，是当前工程上最可靠的幻觉控制路线；纯生成式回答仍不可控"
      gap_for_us: "本方案的『不设真人在环』成立前提：RAG 未命中即兜底转人工，而非让模型自由发挥"

# ============ 三、SaaS 厂商格局与成熟度 ============
saas_landscape:
  segments:
    - segment: "通用型 SCRM（企微 ISV）"
      players: "微伴助手 / 尘锋 / 探马"
      ai_form: "侧边栏话术辅助 + AI 质检/标签等离线分析；不做 1v1 自动回复"
      maturity: "高（存量最大、同质化严重）"
      pricing: "微伴约 7000~19800 元/年（厂商公开价）"
      fit: "工具给到，效果靠客户自建——6-20 人无技术编制的团队用不起来"
