      verdict: "只能做 Copilot 辅助，无法全自动——与本项目形态不符"
      source: "企微开发者中心"
    - name: "P3 会话存档 API"
      capability: "付费接口；SDK 拉取全量会话（单次上限 1000 条、频控 4000 次/分钟）"
      verdict: "不能发消息，但是合规自证 + 真人话术语料（RAG 拟合真人回答）的基础设施"
