    - "AI 会话质检/敏感词拦截已成 SCRM 标配；『AI+会话合规』是主打卖点"
    - "行业共识：2026 年 AI 成为私域标配，但『智能标签准确率不足 70%』『自动运营仍需人工兜底』的伪 AI 大量存在——POC 实测是选型必要环节"

# ============ 四、成熟度结论：买 / 增强 / 自建 ============
conclusions:
  verdict_summary: "对本项目所需的 8 项 AI 能力：市场已成熟 3 项（直接买/用原生），部分成熟 4 项（基座可用、行业化需定制），不成熟 1 项（LLM 直接算价，须用确定性规则路线规避）。"
  buy: "渠道打标、活码分流、自动欢迎语、关键词敏感词拦截、（如需）侧边栏订单查询 → 采购 SCRM 或用企微原生即可，勿重复造轮子"
  build: "减肥保健品合规话术库（预审核）、促销规则库（确定性算账）、需求澄清问题链、真人话术拟合语料工程、RAG 未命中兜底策略 → FDE 自建，构成方案核心价值"
  enhance: "通用 RAG 问答基座、kf 通道消息回调链路 → 在官方/开源基座上做行业化增强"
  why_fde: "结论推导链：市场供给全部是『工具』形态（SaaS 订阅），效果依赖客户自建知识库与运营——而客户团队 6-20 人、无技术编制，不具备把工具变成『能自动接待的客服』的能力。『FDE 定制交付 × RAG 全自动』组合恰是市场空白象限，也是该业态唯一现实的落地方式。"
  risks:
    - "厂商宣称数据（准确率 95%、人效 3 倍）多出自厂商自评，选型必须 POC 实测"
    - "员工号 1v1 自动化的通道合规风险须前置确认（kf 通道 vs 员工号自动化的取舍）"
    - "白牌保健品若资质不全（无蓝帽子 SKU 宣称减肥功效），AI 放大话术产能的同时会放大合规风险——上线前须完成 SKU 资质审计"
    - "企微对营销骚扰风控趋严，自动化触达频率策略需保守设计，避免封号损失私域资产"
