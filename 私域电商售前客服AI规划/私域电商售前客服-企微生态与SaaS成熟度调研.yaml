  key_constraint: "员工号 1v1 私聊：官方 API 不提供实时消息回调与代发消息接口；非官方 RPA/协议模拟存在限流封号风险。实施通道选型（kf 通道 vs 员工号自动化）须与客户确认风险接受度——这是方案答辩必答题。"
