# ============ 一、企微官方能力与四类接入路径（能力边界事实） ============
wecom_native:
  summary: "企微已从『连接工具』演进为『AI 底座』：官方智能机器人+知识库、智能表格 AI、DeepSeek 接入构成免费基础 AI 层，但均为通用能力，无电商售前垂直逻辑。做 1v1 自动回复，官方开放的接入路径只有四条，能力边界如下。"
  access_paths:
    - name: "P1 微信客服（kf 账号）API"
      capability: "客户无需加好友；消息实时回调 + API 发送回复；官方支持全自动对话；可挂抖音落地页入口"
      verdict: "官方唯一支持全自动 1v1 对话的通道"
      source: "企微开发者中心 document/path/94638"
    - name: "P2 聊天工具栏 JSAPI（侧边栏）"
