title: 正品溯源与版本应答 · RAG 售前信任确认助手
description: 针对瘦身减肥保健品私域售前的单一 AI 场景产品画布。标品信任逻辑下，进入企微 1v1 的客户不问「有没有效」（功效认知已在直播间完成），只问「是不是正品 / 是哪个版本规格 / 渠道可不可信」——本场景由 RAG chatbot 检索正品溯源库，在企微对话中秒级、统一、可信地完成正品信任确认，替代散落在老客服脑中的口径。
userRoles:
  - 减脂塑形需求的 25~45 岁女性客户（抖音直播引流后添加企微）
  - 售前客服（人工，从口径背诵转为兜底处置）
  - FDE 前沿部署工程师（建库与调优）
userPains:
  - 客户最担心买到假货/仿品/非正规版本，反复索要正品凭据，回答含糊或版本说不清就流失
  - 正品凭据、授权链路、防伪验证方式散落，新客服记不全，答复口径不一
  - 孟版/日版等版本差异说不清，客户交叉验证后失去信任
  - 夜间与高峰期无人应答，加粉 30 分钟黄金信任窗口错过
  - 涉及功效表述时易越界，踩《广告法》红线
aiInput:
  - 客户在企微发出的正品/版本/渠道类询问（如「这是正品吗」「孟版和日版有什么区别」「怎么验真」）
  - 客户提及的具体 SKU 或直播场次来源标签
dataKnowledge:
  - 正品溯源库：资质文号/蓝帽子备案、品牌授权链路、防伪码验证方式
  - 商品库：SKU、版本/规格、正品凭据与版本差异说明
  - 预审核合规话术库：涉及功效/安全的表述一律走预审核语料（红线守门）
  - 会话存档语料：金牌客服的正品答疑真实话术（用于拟合真人口径）
workflow:
  - 意图识别：判定为正品/版本/渠道信任类问题，命中则进入正品溯源检索链路
  - 检索应答：从正品溯源库与商品库检索匹配凭据与版本差异，组织为统一口径话术
  - 合规过滤：若问题夹带功效诉求，仅从预审核合规话术库取表述，绝不由大模型自由生成
  - 置信度判定：检索置信度低于阈值或客户点名人工时，触发未命中兜底转人工并附上下文摘要
  - 语料回流：未命中问题入补录队列，FDE 每周复盘补齐正品溯源库
  - 人工仅作兜底：RAG 未命中、客户点名人工、异常情绪时接管，不设真人在环审核
modelUsage:
  - 核心编排：通用大模型（如 GPT-4o / Claude 3.5 Sonnet 级）负责意图识别、多轮澄清与话术组织（拟合真人风格）
  - 硬约束：正品凭据与功效表述只能来自检索到的预审核语料（检索式而非自由生成），禁止模型编造凭据或功效
aiOutput:
  - 企微对话中秒级返回统一口径的正品凭据说明 + 版本差异对比 + 验真指引
  - 命中不足时输出保守话术并无摩擦转接人工
tools:
  - 企微微信客服（kf 账号）API 消息回调与代发
  - 企微会话存档 API（合规自证 + 语料源）
  - RAG 平台与正品溯源/商品/合规话术知识库
productType:
  - 企微侧 FDE 定制部署的 RAG 自动回复 chatbot（全自动 1v1，人工兜底）
  - 交付「能直接上岗自动接待」的业务结果，而非标准化 SaaS 工具
  - 风险边界：优先走 kf 官方通道规避封号风险；无蓝帽子 SKU 不做功效表述；库内无答案即转人工
userGains:
  - 正品信任确认从「老客服口径参差」变为全渠道统一、秒级、可信
  - 首响≤10 秒且 7×24 覆盖，不再错过加粉黄金信任窗口
  - 功效表述红线事件 0 起，正品答疑口径 100% 一致
  - 客户端：快速拿到明确正品凭据与版本差异，降低买假焦虑
  - 业务守护：售前转化率维持约 10% 守护基线不下降（正品类问答命中率上线后建基线跟踪）
