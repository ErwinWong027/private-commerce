title: "私域电商售前客服服务蓝图（As-Is 人工现状 · 承接③业务流程口径）"
config:
  height:
    customerLayer: 170
    frontstageLayer: 200
    backstageLayer: 160
phases:
  - name: 引流承接·加好友
    customerLayer:
      journeyStage: 直播种草后添加企微
      actions:
        - name: 深夜看完直播扫码添加客服询价
          touchpoints: 抖音小风车/获客助手链接/企微名片
          painPoints:
            - 夜间添加后无人应答，热情冷却
            - 次日才收到回复，已脱离直播冲动情境
            - 不知道如何开场提问
          expectations:
            - 加上好友立刻有人回应
            - 直接告诉我价格和活动
          experienceScore: 4
    frontstageLayer:
      processStage: 客户接入与首响
      activities:
        - name: 上班后集中处理隔夜咨询
          role: 售前客服（人工）
          systemTouchpoints: 企微工作台
          dataDependencies:
            - 客户来源渠道
            - 隔夜消息积压队列
          painPoints:
            - 夜间35%~45%咨询积压至次日，首响>8小时
            - 高峰期人均同时接待8-15人，漏回错回
            - 开口黄金窗口（加粉后30分钟）大量错过
          cognitiveLoad: high
        - name: 发送欢迎语并手动打标
          role: 售前客服（人工）
          systemTouchpoints: 企微工作台/SCRM
          dataDependencies:
            - 渠道活码来源
          painPoints:
            - 手动打标易遗漏
            - 欢迎语模板化，新人不熟悉话术边界
          cognitiveLoad: low
    backstageLayer:
      supportProcess: 排班与流量错配
      activities:
        - name: 班次制排班管理
          role: 客服主管
          systemTouchpoints: 排班表/企微后台
          painPoints:
            - 全天候流量×班次制人力的结构性错位
            - 补夜班需三班倒，至少加2-3个编制
          cognitiveLoad: medium

  - name: 询价·需求澄清
    customerLayer:
      journeyStage: 询价并求证正品与版本
      actions:
        - name: 问价格并求证是不是正品/什么版本
          touchpoints: 企微聊天窗口
          painPoints:
            - 最关心是不是正品、是哪个版本/规格，回答含糊或版本说不清就流失
            - 担心买到假货仿品，反复索要正品凭据
            - 描述模糊反复被追问，体验差
          expectations:
            - 得到明确的正品凭据与版本/规格差异说明
            - 被专业地引导确认适配版本与用法
          experienceScore: 5
    frontstageLayer:
      processStage: 需求澄清与答疑
      activities:
        - name: 按经验应答正品求证与需求澄清
          role: 售前客服（人工）
          systemTouchpoints: 企微工作台/个人经验
          dataDependencies:
            - 正品凭据与版本说明话术（沉淀在老客服个人脑中）
          painPoints:
            - 正品求证/版本对比话术未标准化，新老客服水平参差
            - 新客服培训30天才能独立上岗
            - 经验沉淀在个人聊天记录，离职即流失
          cognitiveLoad: high
        - name: 应答功效/安全类长尾问题（低频但合规风险最高）
          role: 售前客服（人工）
          systemTouchpoints: 话术文档/群共享文件
          dataDependencies:
            - 合规话术库（散落文档，覆盖不全）
          painPoints:
            - 功效表述踩《广告法》红线风险靠自觉兜底（主动说功效拉单最易越界）
            - 夜间和大促疲劳时段违规话术高发
            - 话术文档更新不及时，检索靠翻聊天记录
          cognitiveLoad: critical
    backstageLayer:
      supportProcess: 话术与培训支撑
      activities:
        - name: 话术库维护与新人培训
          role: 运营/资深客服兼任
          systemTouchpoints: 文档工具/培训材料
          painPoints:
            - 无专职编制，话术库覆盖率低
            - 合规审核靠事后抽检，覆盖率低
          cognitiveLoad: medium

  - name: 商品对比
    customerLayer:
      journeyStage: 对比版本规格与渠道
      actions:
        - name: 询问版本/规格差异与真伪辨别
          touchpoints: 企微聊天窗口/商品详情页
          painPoints:
            - 版本/规格差异说不清（标品只差在版本，如替西帕肽之孟版/日版）
            - 等客服翻资料回复慢
            - 担心比其他渠道买贵、买到非正规版本
          expectations:
            - 清晰的版本对比结论与正品凭据
            - 回答专业一致，不前后矛盾
          experienceScore: 5
    frontstageLayer:
      processStage: 对比讲解
      activities:
        - name: 手动整理版本/规格参数生成对比话术
          role: 售前客服（人工）
          systemTouchpoints: 商品资料文档/详情页
          dataDependencies:
            - SKU参数（版本/规格/价格/正品凭据）
          painPoints:
            - 手动翻资料复制粘贴，耗时且易错漏
            - 不同客服讲法不一致，客户交叉验证后失去信任
            - 涉及功效对比时易越界表述
          cognitiveLoad: high
    backstageLayer:
      supportProcess: 商品资料管理
      activities:
        - name: SKU资料与资质维护
          role: 运营
          systemTouchpoints: 商品文档/资质文件
          painPoints:
            - 蓝帽子资质覆盖情况未系统化管理
            - 新品资料更新滞后
          cognitiveLoad: medium

  - name: 促销算账
    customerLayer:
      journeyStage: 问优惠、算总价
      actions:
        - name: 询问活动优惠并反复调整组合
          touchpoints: 企微聊天窗口
          painPoints:
            - 满减/赠品/组合价规则复杂算不清
            - 客服算错价导致纠纷
            - 高峰期算账等待久
          expectations:
            - 快速给出准确的到手价
            - 报价前后一致、说到做到
          experienceScore: 6
    frontstageLayer:
      processStage: 人工算账报价
      activities:
        - name: 手动计算促销组合价
          role: 售前客服（人工）
          systemTouchpoints: 促销规则文档/计算器
          dataDependencies:
            - 当期促销规则（文档/群通知）
            - 客户拟购组合
          painPoints:
            - 规则叠加复杂，人工计算易错价
            - 错价承诺引发客诉与赔付
            - 客户反复改组合需反复重算，高峰期压力大
          cognitiveLoad: critical
    backstageLayer:
      supportProcess: 促销规则发布
      activities:
        - name: 促销规则制定与同步
          role: 运营
          systemTouchpoints: 文档/群通知
          painPoints:
            - 规则以文档/口头同步，客服理解偏差
            - 规则频繁变更难跟进
          cognitiveLoad: medium

  - name: 下单·发货跟进
    customerLayer:
      journeyStage: 下单支付与催发货
      actions:
        - name: 下单后询问发货与物流进度
          touchpoints: 企微聊天窗口/订单页
          painPoints:
            - 何时发货说不准
            - 物流查询要等客服上班
          expectations:
            - 随问随答的物流状态
            - 靠谱的发货时效承诺
          experienceScore: 6
    frontstageLayer:
      processStage: 订单与物流应答
      activities:
        - name: 手动查单回复物流状态
          role: 售前客服（人工）
          systemTouchpoints: 订单后台/物流查询页
          dataDependencies:
            - 订单状态
            - 物流单号与轨迹
          painPoints:
            - 跨系统查询后手动复述，占用大量重复劳动
            - 夜间物流咨询无人应答
            - 发货时效凭感觉承诺，说错引发客诉
          cognitiveLoad: medium
    backstageLayer:
      supportProcess: 订单履约支撑
      activities:
        - name: 订单与物流数据维护
          role: 仓储/电商后台
          systemTouchpoints: 订单系统/物流系统
          painPoints:
            - 数据未开放接口，客服只能人肉查询
            - 大促期发货时效波动大
          cognitiveLoad: medium
