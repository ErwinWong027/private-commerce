# ============================================================================
# 保健品私域电商售前客服 · 北极星 OSM 战略分析（rev.3 北极星口径升级）
# 第 2 步 / 共 7 步 · 前承：①业务现状分析（含SWOT，三约束+10%健康水位）→ 本步收敛为战略指标体系 · 后启：③业务流程 → ④服务蓝图 → ⑤AI场景地图 → ⑥优先级矩阵 → ⑦里程碑计划
# ----------------------------------------------------------------------------
# 【rev.3 北极星口径升级说明】
#   北极星指标不必是"提高"的指标——它的准确定义是"衡量核心业务健康度和最终
#   价值的最关键指标"。高客单价、重信任的私域业务中流量获取成本极高：转化率
#   从 10% 掉到 8%，对利润的打击是毁灭性的，"守住 10% 基本盘"本身就是巨大的
#   商业价值。因此北极星指标升级为：
#   ★ 高意向客户首单转化率（目标：稳健维持 ≥10%）＝ AI 赋能下的转化率护城河
#   旧口径的"RAG 自动接待率 ≥80%"不再作为北极星，降级为效率层核心指标。
#
# 【汇报话术（对评审专家的表述转换）】
#   不说"目标是维持 10% 不变"，而说："引入 AI 的核心目的，不是盲目追求转化率
#   数字增长，而是在业务规模扩大、夜间流量涌入时，以极低的边际成本稳定承接并
#   维持这 10% 的转化率。" AI 的真正 ROI 体现在人力成本骤降与长尾/夜间增量。
#
# 【三层拆解：维持之下找增量】
#   底线层（维持）——AI 独立接待下整体转化率不掉出 9%~10% 健康区间；
#   效率层（大幅优化）——RAG 自动接待率 ≥80%、转人工率 ≤20%，人力与流量解耦，
#     这是 AI ROI 的主要来源；
#   增量层（突破）——长尾/沉睡/夜间客户原本直接流失，AI 承接后额外捞回
#     2%~3% 转化，属于纯增量，不冲击 10% 基本盘口径。
# ============================================================================
title: "保健品私域电商售前客服 · 北极星 OSM 战略分析（NSM：首单转化率护城河 稳健维持 ≥10% · 三层拆解）"
config:
  height:
    objectiveScore: 90
objectives:
  # ── 北极星指标（NSM）＝ AI 赋能下的转化率护城河 ──────────────────────
  - name: "北极星指标：高意向客户首单转化率（AI 赋能下的转化率护城河）"
    value: "稳健维持 ≥10%（9%~10% 为健康区间底线）"
    trend: stable
    subObjectives:

      # ── 底线层：维持 ────────────────────────────────────────────
      - name: "底线层 B · 转化率护城河（维持）"
        value: "整体转化率不掉出 9%~10% 健康区间"
        trend: stable
        strategies:
          - AI 接管会话与人工会话按周分组对照，连续两周显著低于健康区间即触发回滚与知识库复盘
          - 灰度放量闸门：按流量比例逐步扩大 RAG 接管范围，每档放量前须通过转化率闸门
          - 合规内置于知识库——用法用量/副作用类专业问答只走预审核合规语料；红线事件直接摧毁信任盘，合规塌方即转化塌方
          - RAG 话术从会话存档真实成交对话学习，拟合金牌销售口径而非通用模板
        metrics:
          - name: 售前首单转化率（北极星指标）
            calculation: "成交下单客户数 / 加好友询价客户数（周度）"
            value: "基线: 约10% 目标: 稳健维持 ≥10%，不掉出 9% 底线"
            trend: stable
          - name: AI vs 人工转化率差值
            calculation: "RAG 接管组周转化率 - 人工对照组周转化率"
            value: "守护线: 差值无显著为负（连续两周为负触发回滚）"
            trend: stable
          - name: 合规红线事件数
            calculation: "功效宣称触碰《广告法》红线的对外回复条数（月度）"
            value: "当前: 靠人工培训兜底、水平参差 目标: 0 起"
            trend: down
        relatedScenarios:
          scenarios:
            - name: 转化率守护监测与回滚
              description: 数据看板按周输出 RAG 接管组与人工对照组的转化率对照;连续两周 RAG 组显著低于健康区间时自动告警,该流量段回退人工接管,FDE 复盘未命中日志与话术拟合度后修复再灰度——确保降本增效不以基本盘为代价。
            - name: 专业问答合规应答
              description: 减肥保健品售前有大量专业问答(如"替西帕肽怎么打""有什么副作用"),人工回答易疲劳出错、口径参差且有越界风险;RAG 只从预审核合规话术库检索应答,每一次解答都合规、专业、口径一致,把"绝对合规"从培训要求变成系统能力。

      # ── 效率层：大幅优化（AI ROI 主源）──────────────────────────
      - name: "效率层 E · 边际成本骤降（AI ROI 主源）"
        value: "RAG 自动接待率 ≥80% · 人力与流量解耦"
        trend: up
        strategies:
          - RAG 接管标准化售前问答（正品版本/价格促销/物流发货三类为主），把人工从机械问答中解放出来跟进高价值客户
          - 直播放量不再触发「加人」——咨询量与客服编制解耦，新增流量的服务边际成本趋近于零
          - 新客服培训从话术背诵转向兜底处置，培训周期大幅压缩
        metrics:
          - name: RAG 自动接待率（效率层核心指标）
            calculation: "RAG 全自动完成应答的会话数 / 售前总会话数（旧北极星，rev.3 降级至此）"
            value: "当前: 0% 目标: 上线3个月 ≥80%"
            trend: up
          - name: 兜底转人工率
            calculation: "转人工会话数 / 总会话数（RAG 未命中 + 客户点名人工）"
            value: "当前: 100% 目标: ≤20%（行业优秀实践可降 30%~40%）"
            trend: down
          - name: 人效与培训周期
            calculation: "单客服可承载咨询量倍数；新客服独立上岗培训天数"
            value: "承载 ≥3 倍 · 培训 30天 → ≤7天"
            trend: up
        relatedScenarios:
          scenarios:
            - name: RAG 未命中兜底转接
              description: RAG 检索置信度低于阈值或客户明确要求人工时,自动转接在线客服并推送已澄清的上下文摘要(客户需求、已答内容、卡点问题);未命中问题自动进入知识库补录队列,由 FDE 每周复盘补齐语料,兜底率随运营持续收敛。
            - name: 直播放量人力不加编
              description: 抖音直播间放量投放,当日咨询量翻倍,RAG 自动接待层弹性承载全部标准化问答,人工编制不变;运营侧只需在直播前把本场促销规则更新入促销规则库,算账口径即刻生效,无需临时培训客服。

      # ── 增量层：突破（纯增量，不冲击基本盘口径）──────────────────
      - name: "增量层 I · 长尾与夜间捞回（纯增量突破）"
        value: "额外捞回原本流失的 2%~3% 转化"
        trend: up
        strategies:
          - 7×24 秒级首响：夜间直播后咨询高峰（占比 35%~45%，现状零接待）全量承接，流量不再在等待中冷却流失
          - 人工精力只够顾及头部客户——被忽略的长尾/沉睡客户由 AI 一视同仁承接并精准唤回
          - 增量单独归因：夜间/长尾成交打独立标记记账，证明为纯增量、不冲击 10% 基本盘口径
        metrics:
          - name: 夜间咨询承接率
            calculation: "22:00-9:00 获得有效应答的咨询数 / 夜间总咨询数"
            value: "当前: ≈0% 目标: 100%"
            trend: up
          - name: 首次响应时长（全时段）
            calculation: "首条自动回复时间 - 用户首条消息时间（P90）"
            value: "当前: 白班1~3分钟/夜间>8小时 目标: ≤10秒"
            trend: down
          - name: 增量转化捞回率
            calculation: "夜间/长尾/唤回渠道成交客户数 / 总询价客户数（独立归因口径）"
            value: "目标: +2%~3% 纯增量（上线后建基线跟踪）"
            trend: up
        relatedScenarios:
          scenarios:
            - name: 夜间全自动接待闭环
              description: 夜间时段询价、需求澄清、商品对比、促销算账、下单引导全流程由 RAG 独立完成;RAG 未命中的问题自动挂起并生成待办,次日早班人工首优先跟进,并附上 chatbot 已完成的澄清上下文,避免客户重复描述。
            - name: 长尾与沉睡客户承接唤回
              description: 人工在班时优先服务高意向头部客户,长尾咨询往往数小时无人跟进直至流失;AI 对全部咨询秒级一视同仁承接,并对 48h 未成交的沉睡客户按促销节点用预审核话术精准唤回,把原本注定流失的询价转成增量成交。
