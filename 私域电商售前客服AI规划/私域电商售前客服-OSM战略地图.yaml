# ============================================================================
# 瘦身减肥类保健品私域电商 · 北极星 OSM 战略分析（rev.4 层级重构）
# 第 2 步 / 共 7 步 · 前承：①保健品私域电商业务现状分析 → 本步收敛为业务级战略指标体系
# 后启：③保健品私域电商业务流程 → ④售前客服服务蓝图 → ⑤售前客服AI场景地图 → ⑥优先级矩阵 → ⑦售前客服AI助手制作计划
# ----------------------------------------------------------------------------
# 【rev.4 层级重构说明】
#   修正 rev.3 的层级错位：北极星指标必须是"保健品私域电商"业务级指标，
#   而非"售前客服"子流程指标。售前客服是私域电商的一个子流程（获客→售前→
#   下单→履约→复购），其"首单转化率≥10%"降级为本 OSM 售前转化子目标的核心
#   支撑指标，不再是北极星本身。
#
#   ★ 北极星指标：私域客户生命周期价值（LTV）稳健增长 ≥15%
#     ＝ 综合体现获客效率 × 售前转化 × 复购运营 × 合规护城河的业务健康度
#
# 【三层拆解：LTV = 首单贡献 + 复购贡献 - 获客成本 - 合规损失】
#   获客层（效率）——提升引流加粉转化，降低单客获取成本（LTV 分母优化）
#   售前层（守底线+降本）——守住首单转化率≥10%健康水位，AI 降本 50%（LTV 首单贡献）
#   复购层（增量）——提升复购频次与客单价，放大 LTV 主体（复购贡献占比 60%+）
# ============================================================================
title: "保健品私域电商 · 北极星OSM（LTV稳健增长）"
config:
  height:
    objectiveScore: 90
objectives:
  # ── 北极星指标（NSM）＝ 保健品私域电商业务级 LTV ──────────────────
  - name: "提升私域客户LTV"
    value: "LTV 稳健增长 ≥15%"
    trend: up
    subObjectives:

      # ── 获客层：提升引流加粉效率（LTV 分母优化）──────────────────
      - name: "提升引流加粉转化"
        value: "加粉转化 15%→25%"
        trend: up
        strategies:
          - 抖音直播间专属活码引流加粉
          - 引流钩子A/B测试持续优化
          - 企微活码自动打标与个性化开场
        metrics:
          - name: 直播加粉转化率
            calculation: "加企微数 / 直播观看UV"
            value: "当前: 15% 目标: 25%"
            trend: up
          - name: 新粉首日开口率
            calculation: "首日发消息新粉 / 新增好友"
            value: "当前: 40% 目标: 60%"
            trend: up
          - name: 单客获取成本
            calculation: "引流总投入 / 新增好友数"
            value: "当前: 基线 目标: 降30%"
            trend: down
        relatedScenarios:
          scenarios:
            - name: 直播引流加粉旅程
              description: 抖音直播间通过专属企微活码引导观众添加客服,系统自动识别来源场次并打标;AI根据直播主题推送个性化欢迎语与品类钩子(如"直播间提到的XX版本详情"),将加粉后30分钟黄金窗口转化为有效咨询,从源头提升私域流量池质量。
            - name: 引流钩子A/B测试
              description: 运营在直播前配置多套引流话术与加粉钩子(如"加好友领减脂食谱"vs"加好友查正品验真"),AI自动追踪不同钩子的加粉率、开口率与最终转化率,按周输出最优组合建议,持续优化引流效率并降低单客获取成本。

      # ── 售前层：守住转化底线 + AI 降本（LTV 首单贡献）─────────────
      - name: "守住售前转化降本"
        value: "首单≥10%·接待成本降50%"
        trend: up
        strategies:
          - AI 7×24秒级首响承接全时段流量
          - RAG承接标准化售前问答降本解耦
          - 合规内置于知识库守红线零事件
          - 转化率守护看板与灰度回滚闸门
        metrics:
          - name: 首单转化率
            calculation: "成交下单客户 / 加好友询价客户"
            value: "基线: 10% 目标: 守住≥10%"
            trend: stable
          - name: RAG自动接待率
            calculation: "RAG完成会话 / 售前总会话数"
            value: "当前: 0% 目标: ≥80%"
            trend: up
          - name: 首次响应时长
            calculation: "首条回复 - 首条消息（P90）"
            value: "当前: >8h 目标: ≤10s"
            trend: down
          - name: 合规红线事件数
            calculation: "触碰广告法红线对外回复条数"
            value: "当前: 靠培训 目标: 0起"
            trend: down
        relatedScenarios:
          scenarios:
            - name: 夜间全自动接待闭环
              description: 夜间直播后咨询高峰(占比35%-45%)由RAG独立完成秒级首响、正品答疑、促销算账全流程;未命中问题挂起生成待办,次日早班优先跟进并附已澄清上下文,避免客户重复描述,守住10%转化基本盘的同时实现零夜班编制与接待成本降50%。
            - name: 转化率守护与回滚
              description: 数据看板按周对照RAG接管组与人工对照组转化率;连续两周RAG组显著低于10%健康区间时自动告警,该流量段回退人工,FDE复盘未命中日志修复后灰度——确保降本不以转化为代价;合规话术库预审核确保红线事件0起,保护私域资产不受罚款与封号损失。

      # ── 复购层：提升复购频次（LTV 主体增量）──────────────────────
      - name: "提升老客复购频次"
        value: "复购率 35%→45%"
        trend: up
        strategies:
          - AI复购周期预测与精准推送
          - 沉睡客户按节点精准唤回
          - 会员等级体系提升留存动机
        metrics:
          - name: 老客复购率
            calculation: "复购客户 / 活跃老客数"
            value: "当前: 35% 目标: 45%"
            trend: up
          - name: 月均复购频次
            calculation: "月订单数 / 月活跃老客数"
            value: "当前: 1.8次 目标: 2.5次"
            trend: up
          - name: 私域客户LTV
            calculation: "客户全生命周期总消费额"
            value: "当前: 基线 目标: +15%"
            trend: up
        relatedScenarios:
          scenarios:
            - name: AI复购周期预测推送
              description: 模型每日计算老客"7日内复购概率",对概率>60%的客户在次日推送其历史偏好品类的补货通知与限时优惠;基于保健品2-6个月服务周期自动预测消耗节点,在预计用完前3天触发关怀话术与复购引导,将复购频次从1.8次提升至2.5次。
            - name: 沉睡客户精准唤回
              description: 对48h未成交的沉睡客户,AI按促销节点用预审核合规话术精准唤回;对超过1个服务周期未复购的老客,推送新品体验邀请与会员专属折扣,把原本流失的私域资产重新激活;唤回成交单独归因,持续提升LTV而不冲击首单转化基本盘口径。