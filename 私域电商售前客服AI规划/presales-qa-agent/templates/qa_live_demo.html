<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>售前问答 · LLM 实时运行 Demo</title>
<style>
:root{
  --color-primary:#10213E; --color-accent:#5DB2E2; --color-secondary:#625D9C;
  --color-success:#00524C; --color-warning:#F59E0B; --color-tool:#0E7C66;
  --color-bg:#FFFFFF; --color-bg-alt:#F5F5F6; --color-fg:#10213E;
  --color-muted:#64748B; --color-border:#E2E8F0; --color-llm:#625D9C;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"MiSans","Microsoft YaHei","Inter",Arial,sans-serif;background:var(--color-bg-alt);color:var(--color-fg);line-height:1.6;}
.container{width:85%;margin:0 auto;padding:28px 0 56px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 0 18px;border-bottom:1px solid var(--color-border);margin-bottom:22px;}
.page-header h1{font-size:26px;font-weight:600;color:var(--color-primary);}
.page-header .subtitle{font-size:13.5px;color:var(--color-muted);margin-top:6px;}
.arch-bar{background:linear-gradient(135deg,#1B2B47 0%,#4A9FD8 100%);color:#fff;border-radius:8px;padding:16px 22px;margin-bottom:20px;font-size:13px;line-height:1.9;}
.arch-bar b{color:#BFE3F7;}
.arch-bar .llm{color:#C4B5FD;font-weight:600;}
.arch-bar .tool{color:#6EE7B7;font-weight:600;}
.chips{background:var(--color-bg);border:1px solid var(--color-border);border-radius:8px;padding:14px 18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(16,33,62,.06);}
.chips .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--color-secondary);text-transform:uppercase;margin-bottom:10px;}
.chips .chip{display:inline-block;font-size:12.5px;color:var(--color-primary);background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:20px;padding:6px 14px;margin:0 8px 8px 0;cursor:pointer;transition:all .15s;}
.chips .chip:hover{border-color:var(--color-accent);background:#EAF6FC;}
.workspace{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;}
.panel{background:var(--color-bg);border:1px solid var(--color-border);border-radius:8px;box-shadow:0 2px 8px rgba(16,33,62,.08);display:flex;flex-direction:column;height:620px;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:10px;}
.panel-head .dot{width:10px;height:10px;border-radius:50%;}
.panel-head .t{font-size:15px;font-weight:700;color:var(--color-primary);}
.panel-head .sub{font-size:12px;color:var(--color-muted);margin-left:auto;}
.chat-dot{background:var(--color-accent);}
.chat-body{flex:1;overflow-y:auto;padding:18px;background:var(--color-bg-alt);}
.msg{display:flex;margin-bottom:14px;}
.msg .bubble{max-width:80%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.msg.cust{justify-content:flex-end;}
.msg.cust .bubble{background:var(--color-accent);color:#fff;border-bottom-right-radius:3px;}
.msg.ai{justify-content:flex-start;}
.msg.ai .bubble{background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-fg);border-bottom-left-radius:3px;}
.msg.ai .bubble.human{border-left:3px solid var(--color-warning);}
.msg.thinking .bubble{color:var(--color-muted);font-style:italic;border:1px dashed var(--color-border);}
.chat-input{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--color-border);}
.chat-input input{flex:1;font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--color-border);border-radius:6px;outline:none;}
.chat-input input:focus{border-color:var(--color-accent);box-shadow:0 0 0 2px rgba(93,178,226,.25);}
.chat-input button{font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;background:var(--color-primary);border:none;border-radius:6px;padding:9px 18px;cursor:pointer;}
.chat-input button:hover{opacity:.85;}
.chat-input .clear{background:var(--color-bg-alt);color:var(--color-muted);border:1px solid var(--color-border);}
.trace-dot{background:var(--color-secondary);}
.trace-body{flex:1;overflow-y:auto;padding:16px 18px;}
.trace-empty{color:var(--color-muted);font-size:13px;text-align:center;margin-top:40px;line-height:1.9;}
.wf-turn{margin-bottom:18px;border:1px solid var(--color-border);border-radius:8px;overflow:hidden;background:var(--color-bg);}
.wf-turn .wf-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--color-bg-alt);border-bottom:1px solid var(--color-border);}
.wf-turn .wf-num{font-size:11px;font-weight:700;color:#fff;background:var(--color-secondary);border-radius:5px;padding:2px 8px;}
.wf-turn .wf-intent{font-size:13px;font-weight:700;color:var(--color-primary);}
.wf-turn .wf-flag{font-size:11px;font-weight:700;border-radius:5px;padding:2px 9px;margin-left:auto;}
.wf-flag.auto{background:#E6F4EA;color:var(--color-success);}
.wf-flag.human{background:#FEF3E2;color:var(--color-warning);}
.wf-step{padding:10px 14px;border-bottom:1px solid var(--color-border);}
.wf-step:last-child{border-bottom:none;}
.wf-step .s-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.wf-step .s-badge{font-size:
