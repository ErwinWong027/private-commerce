# ============ 八、调研结论：三个结构性约束 → AI 价值方向 ============
conclusions:
  constraints:
    - name: "响应受班次限制"
      evidence: "全天候流量 × 班次制人力：夜间 35%~45% 咨询等待 >8 小时"
      ai_direction: "7×24 秒级自动应答（体验）"
    - name: "人力成本随流量线性上涨"
      evidence: "咨询量涨只能加人；6-20 人团队年人力成本 43 万~240 万且随放量膨胀"
      ai_direction: "RAG 承接 75%~85% 标准化问题，人力与流量解耦（效率）"
    - name: "回答质量与合规不稳定"
      evidence: "强监管品类靠人工培训兜底；30 天培训周期、话术参差、夜间/大促高发"
      ai_direction: "预审核合规话术库 + 确定性规则检索，回答合规稳定、不幻觉（质量）"
  non_goal: "明确的『不做项』：不以提升转化率为目标（10% 为正常水位），不分析未转化客户犹豫信号，不设真人在环审核。转化率作为守护指标进入 OSM。"
  next_step: "下一步：①企微生态与 SaaS 成熟度调研——验证市场上哪些 AI 能力已成熟可用、哪些是空白（回答『为什么要 FDE 自建』）；②服务蓝图——把三个约束解剖到流程级，定位 RAG 接管点。"
