# ============ 一、业务模式画像（已验证跑通的业务底盘） ============
business_model:
  positioning: "瘦身减肥类保健品私域电商（白牌/新锐品牌典型业态），业务模式已跑通且成熟"
  product:
    category: "瘦身减肥类保健品/功能性食品"
    price_band: "100~1000 元，全部属于中客单价（本项目无『高客单』概念）；主力成交价预计 300~600 元 [推断：基于减肥保健品类目公开售价分布]"
    consumption_cycle: "周期性消耗品，单用户服务周期 2~6 个月（对标：润天健康医学减重服务周期，来源：买量小飞机行业分析）"
  target_user:
    profile: "25~45 岁女性，减脂塑形需求，价格中度敏感、正品与渠道可信度高度敏感（功效认知已在直播间种草阶段完成）"
    decision_traits:
      - "标品信任逻辑：核心顾虑是『是不是正品』『是哪个版本/规格』『渠道可不可信』——能进入 1v1 的客户对产品功效已被直播间种草说服（对标：替西帕肽私域电商，消费者只问正品与孟版/日版之别，不问有没有效——如同买百事可乐不会问好不好喝）；售前 1v1 的本质是正品信任确认 + 交易撮合，不是功效说服"
      - "咨询发起时间跟随直播场次：夜间直播后是提问高峰，与客服班次天然错位"
      - "问题高度标准化：正品与版本对比、价格促销、物流发货三类问题预计占全部售前咨询 75%~85%（功效/安全类为低频长尾，一律走预审核合规话术库应答）[推断，需会话存档数据验证]"
  funnel:
    description: "抖音直播间 → 引流组件/福利钩子 → 添加企微客服 → 1v1 售前咨询（询价/需求澄清/商品对比/促销算账）→ 下单支付 → 物流发货跟进（项目边界止于发货，不含售后）"
    conversion_baseline: "加好友 → 首单转化率约 10%，为行业正常健康水位（本项目守护基线：维持 ≥10% 不下降，不设提升目标，不分析未转化 90% 客户的犹豫信号）"
    stages:
      - name: "抖音直播转化"
        note: "抖音直播间平均成交转化率约 1%-3%（来源：蝉妈妈数据）；小风车/群聊组件引流企微为合规主流链路"
      - name: "企微加粉承接"
        note: "加粉后 30 分钟内是开口黄金窗口 [推断：私域运营通行经验]；响应延迟直接损失开口率"
      - name: "售前咨询转化（人工 1v1）"
        note: "约 10% 转化率 = 正常水位；本环节的问题不在转化模型，而在服务全靠人工扛"
      - name: "履约发货"
        note: "发货时效承诺是售前客诉高发点，需订单/物流系统确定性数据支撑"

# ============ 二、人工售前服务效率基线（本项目核心调研对象） ============
efficiency_baseline:
  note: "以下为 RAG chatbot 上线前必须锚定的『人工现状』基线；标注[事实]为公开来源支撑，[推断]为行业通行经验推算，均需客户后台数据校准。"
  metrics:
    - metric: "首次响应时长（白班在岗时段）"
      value: "1~3 分钟（高峰期 5~10 分钟起）"
      basis: "[推断] 私域 1v1 人工客服通行水平；高峰期人均同时接待 8-15 人时响应显著劣化"
    - metric: "首次响应时长（夜间/非工作时段）"
      value: ">8 小时（次日上班后集中回复）"
      basis: "[推断] 6-20 人团队普遍不设夜班；夜间直播后咨询积压至次日"
    - metric: "夜间及非工作时段咨询占比"
      value: "预计 35%~45%"
      basis: "[推断] 抖音电商流量晚间 18:00-24:00 为高峰（来源：巨量算数/蝉妈妈公开口径，晚间时段贡献过半 GMV），直播后咨询延伸至凌晨；需客户企微后台按时段分布确认"
    - metric: "人均同时接待上限"
      value: "8~15 人（超过即出现漏回、错回）"
      basis: "[推断] 私域 1v1 强运营业态通行值"
    - metric: "单次售前会话平均轮次/时长"
      value: "15~30 轮 / 20~60 分钟（含需求澄清与算账）"
      basis: "[推断] 中客单价保健品决策特征；需会话存档验证"
    - metric: "新客服培训上岗周期"
      value: "约 30 天（其中合规话术培训为最大占比）"
      basis: "[推断] 强监管品类新人须背诵合规话术边界；经验沉淀在个人微信记录中难迁移"
    - metric: "夜间流量流失机制"
      value: "夜间咨询次日回复时，客户已脱离直播冲动情境，开口客户流失显著"
      basis: "[推断] 私域运营共识：响应延迟越长开口转化越差；具体流失率需客户 A/B 数据验证"
  key_conclusion: "效率瓶颈不是『人不够努力』，而是结构性错位：全天候流量 × 班次制人力。这决定了 AI 的第一价值落点是 7×24 秒级响应，而非替代人工做更聪明的转化。"

# ============ 三、人力成本结构基线 ============
cost_baseline:
  note: "客服团队 6-20 人、无专职技术编制，为该业态典型配置。"
  structure:
    - item: "售前客服直接人力成本"
      value: "单人月薪 4500~8000 元，综合用工成本（含社保/场地/管理）约 6000~10000 元/人/月；按 6-20 人计，年成本约 43 万~240 万元"
      basis: "[推断] 二三线城市电商客服薪酬公开区间（来源：招聘平台公开薪酬数据口径）"
    - item: "线性上涨机制"
      value: "直播放量 → 咨询量上涨 → 只能加人；若补齐夜班需三班倒，至少额外增加 2~3 个编制"
      basis: "[事实] 客户已明确此为核心约束：人力成本随流量线性上涨，人效天花板明显"
    - item: "隐性成本：流失与重训"
      value: "电商客服年流失率普遍 30%~50%，每次流失伴随约 30 天重训周期与服务质量波动"
      basis: "[推断] 客服行业公开流失率口径；需客户 HR 数据确认"
    - item: "隐性成本：合规质检"
      value: "话术合规靠培训+抽检兜底，无专职合规编制（0-1 人兼任），质检覆盖率低"
      basis: "[推断] 中小私域团队通行现状"
  key_conclusion: "成本瓶颈的本质是『人力与流量线性耦合』。AI 的第二价值落点是解耦：RAG 承接标准化的 75%~85% 问题，人工只保留兜底位，咨询量增长不再驱动编制增长。"

# ============ 四、合规现状基线（减肥保健品专项） ============
compliance:
  regulatory_framework:
    - item: "保健食品双轨制管理"
      detail: "保健食品实行注册+备案双轨制，必须具有『蓝帽子』标志及批准文号；普通食品不得宣称减肥等保健功能"
      source: "市场监管总局；新华网（news.cn 2025-01）"
    - item: "广告宣称红线"
      detail: "食品广告不得涉及疾病预防、治疗功能；禁用『最便宜』『绝对』『100%有效』等绝对化用语；减肥功效宣称仅限获批保健食品在批准范围内表述"
      source: "《广告法》《食品广告发布暂行规定》；法治日报（2024-02）"
    - item: "违法成本量级"
      detail: "发布虚假广告最高可处广告费用 5 倍以下或 100 万~200 万元罚款，情节严重可吊销营业执照；1v1 私聊话术同样构成商业广告行为"
      source: "《广告法》第五十五条；《互联网广告管理办法》"
    - item: "2025-2026 监管趋势"
      detail: "市监总局将重点领域广告监管列为全年重点；私域直播虚假/夸大宣传被列为消费问题高发区"
      source: "方达律师事务所 2025 广告合规洞察；新京报（2025-12）"
  current_state:
    - "合规话术靠『培训+个人自觉』兜底：新客服 30 天培训中合规内容占比最高，但话术水平仍参差"
    - "人工回答的合规稳定性随情绪、疲劳、促销压力波动——夜间和大促高峰是违规话术高发时段 [推断]"
    - "会话存档若未开通，则既无合规自证能力，也无 AI 训练语料基础——需在数据确认清单中优先核实"
  key_conclusion: "合规瓶颈的本质是『人工输出的不确定性』。AI 的第三价值落点是确定性：RAG 只检索预审核合规话术库生成回答，合规内置于建库阶段而非依赖临场发挥。"

